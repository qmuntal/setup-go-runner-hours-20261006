name: Independent real-workflow cache pairs
run-name: Runner-hours sample ${{ inputs.sample }} / ${{ inputs.case || 'all' }}
on:
  workflow_dispatch:
    inputs:
      sample:
        type: string
        required: true
        description: Independent sample number, 1 through 10.
      case:
        type: string
        required: false
        description: Optional one-case pilot filter.
permissions:
  contents: read
  actions: write
concurrency:
  group: runner-hours-${{ inputs.sample }}-${{ inputs.case || 'all' }}
  cancel-in-progress: false
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.select.outputs.cases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: select
        env:
          CASE_FILTER: ${{ inputs.case }}
        run: |
          python - <<'PY'
          import json, os
          case_filter=os.environ.get('CASE_FILTER')
          cases=json.load(open('cli-cases.json' if case_filter=='cli' else 'cases.json'))
          include=[{'case':c['id'],'version':v,'runner':c['runner'],'source_repository':c['repository'],'source_sha':c['sha']} for c in cases for v in c['versions'] if not case_filter or case_filter=='cli' or c['id']==case_filter]
          if not include: raise RuntimeError('No benchmark cases selected')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('cases='+json.dumps({'include':include})+'\n')
          PY
  measure:
    needs: matrix
    name: ${{ matrix.case }} / ${{ matrix.version }} / sample ${{ inputs.sample }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.matrix.outputs.cases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.source_repository }}
          ref: ${{ matrix.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: actions/setup-go
          ref: 90ad2b35f69faf97585ad74d28fa006d2739b7af
          path: baseline-action
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: actions/setup-go
          ref: ad9941188fbcb38febe37eac394b80bd9bc34fc8
          path: split-action
          persist-credentials: false
      - name: Install toolchain outside measurement
        uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: ${{ matrix.version }}
          cache: false
      - name: Install sampler outside measurement
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install sampler dependency
        run: python -m pip install -r requirements.txt
      - name: Measure real workflow pairs
        uses: ./
        with:
          case: ${{ matrix.case }}
          version: ${{ matrix.version }}
          sample: ${{ inputs.sample }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish sanitized measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sample-${{ inputs.sample }}-${{ matrix.case }}-${{ matrix.version }}
          path: results/sample.json
          retention-days: 14
          if-no-files-found: warn
